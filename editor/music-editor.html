<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SparrowStudio — MIDI Editor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="main-layout">
        <!-- ===== 左侧控制面板: 参数输入 ===== -->
        <aside class="left-panel">
            <div class="top-bar">
                <h1>SparrowStudio <span class="h1-sub">· MIDI Editor</span></h1>
                <div class="status" id="status">准备就绪。</div>
            </div>
            <div class="transport">
                <button type="button" id="rew-button" class="transport-btn" data-tip="从头开始播放">⏮</button>
                <button type="button" id="play-button" class="ok transport-btn" data-tip="播放 / 暂停（空格）">▶</button>
                <button type="button" id="stop-button" class="transport-btn" data-tip="停止并归零">⏹</button>
                <span class="time" id="time-display">0:00 / 0:00</span>
            </div>
            <input type="range" id="seek-bar" class="seek-bar" min="0" max="1000" value="0" data-tip="播放进度：拖动定位；播放中松开会从该处继续播放，停止状态则只移动播放头">
            <div class="buttons">
                <button id="clear-button" class="danger">清空</button>
                <button type="button" id="import-button">打开 MIDI</button>
                <button id="save-midi-button">保存 MIDI</button>
                <button type="button" id="track-duplicate" data-tip="复制当前音轨：在其后插入一条含全部音符的副本（当前音轨在右侧标签条中切换）">复制音轨</button>
                <button type="button" id="track-delete" class="danger" data-tip="删除当前选中的音轨（先在右侧标签条中切换到要删的音轨）">删除音轨</button>
                <input id="import-file" type="file" accept=".mid,.midi">
            </div>
            <div class="params">
                <label>曲谱 ID<input id="song-id" value="mySong" data-tip="曲谱 ID：保存 MIDI 文件的文件名，也是编辑器内播放用的标识名">
                    <small class="param-hint">保存的文件名与播放标识名</small>
                </label>
                <label>曲名<input id="song-name" value="我的曲谱" data-tip="曲名：仅用于显示">
                    <small class="param-hint">只用于显示</small>
                </label>
                <label>BPM<input id="song-tempo" type="number" min="30" max="240" value="96" data-tip="BPM：每分钟节拍数，控制曲谱速度">
                    <small class="param-hint">控制音乐速度（每分钟节拍数）</small>
                </label>
                <label>小节数量<input id="bar-count" type="number" min="1" max="512" value="16" data-tip="小节数量：曲谱包含多少个小节">
                    <small class="param-hint">曲谱包含多少个小节</small>
                </label>
                <label>每小节拍数<input id="beats-per-bar" type="number" min="1" max="12" value="4" data-tip="每小节拍数：4 即 4/4 拍，决定小节线与循环长度">
                    <small class="param-hint">4 即 4/4 拍</small>
                </label>
                <label>吸附<select id="snap" data-tip="吸附：画音符/移动时的最小时间单位">
                        <option value="1">1 拍</option>
                        <option value="0.5">1/2 拍</option>
                        <option value="0.25" selected>1/4 拍</option>
                        <option value="0.125">1/8 拍</option>
                    </select>
                    <small class="param-hint">画音符/移动的最小时间单位</small>
                </label>
                <label>音轨数量<input id="track-count" type="number" min="1" max="32" value="3" data-tip="音轨数量：同时播放几条乐器线">
                    <small class="param-hint">同时播放几条乐器线</small>
                </label>
            </div>
        </aside>

        <!-- ===== 下方钢琴卷帘编辑区 ===== -->
        <section class="right-panel">
            <div class="editor-section">
                <div class="track-bar">
                    <span class="bar-label">音轨</span>
                    <div class="track-tabs" id="track-tabs"></div>
                </div>
                <div class="track-props">
                    <label>音轨名<input id="track-name"></label>
                    <label>音色<select id="track-instrument" data-tip="音色：这条音轨使用的发声器类型，所有音符共用（悬停滚动滚轮可切换）"></select></label>
                    <label>gate<input id="track-gate" type="number" min="0.1" max="1" step="0.05" data-tip="gate：音符实际发声占时值的比例（0.1-1，悬停滚动滚轮可调）"></label>
                    <div class="note-fields">
                        <label>音名<input id="np-pitch" data-tip="选中音符的音高，可用音名（C4、F#5）精确指定"></label>
                        <label>起点(拍)<input id="np-start" type="number" min="0" step="0.25" data-tip="选中音符的起始位置（拍）"></label>
                        <label>时长(拍)<input id="np-dur" type="number" min="0.125" step="0.25" data-tip="选中音符的持续拍数"></label>
                        <label>力度<input id="np-vel" type="number" min="0" max="127" step="1" data-tip="选中音符的力度（0-127，0 静音），多选时可批量修改"></label>
                    </div>
                </div>
                <div class="roll-wrap" id="roll-wrap">
                    <canvas id="roll-main"></canvas>
                    <canvas id="roll-overlay"></canvas>
                </div>
                <p class="hint">每一条音轨是一个声部，在上方音轨标签中切换编辑；点击左侧<strong>琴键</strong>可试听音高，点击顶部<strong>小节标尺</strong>从该处播放，<strong>右键拖动</strong>可平移画面（右键点击音符 = 删除）。和弦直接画在同一轨上叠放即可（播放时自动拆声部）。快捷键：左键拖动=画音符 · 拖右缘=改时值 · Shift+拖动=框选 · Ctrl+Z/Y=撤销重做 · Ctrl+C/V=复制粘贴 · 空格=播放/暂停。保存的 MIDI 再次导入不会增轨（和弦声部自动并回原音轨）；外部 MIDI 中同一轨且同音色的多个通道也会合并为一条编辑轨。</p>
            </div>
        </section>
    </main>

    <!-- 自定义确认弹窗 -->
    <div class="modal-overlay" id="confirm-overlay">
        <div class="modal">
            <h3 class="modal-title" id="confirm-title">确认</h3>
            <p class="modal-body" id="confirm-body"></p>
            <div class="modal-buttons">
                <button id="confirm-cancel">取消</button>
                <button class="danger" id="confirm-ok">确认</button>
            </div>
        </div>
    </div>

    <!-- 基础依赖层 core/ + 音色层 instruments/（顺序即依赖顺序） -->
    <script src="../core/audio-core.js"></script>
    <script src="../core/note-parser.js"></script>
    <script src="../instruments/instruments.js"></script>
    <script src="../core/synth.js"></script>
    <script src="../core/sequencer.js"></script>
    <script src="../core/sfx-player.js"></script>
    <script src="../core/midi-parser.js"></script>
    <script src="../core/audio-manager.js"></script>
    <script src="../instruments/sfx-library.js"></script>
    <!-- 编辑器模块（main.js 必须最后加载） -->
    <script src="shared.js"></script>
    <script src="ui.js"></script>
    <script src="state.js"></script>
    <script src="pianoroll.js"></script>
    <script src="song.js"></script>
    <script src="playback.js"></script>
    <script src="io.js"></script>
    <script src="main.js"></script>
</body>
</html>
